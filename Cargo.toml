[package]
name = "avahi-subdomains"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
zbus = { version = "6.2.1", default-features = false, features = ["default-rt", "proxy"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
